[tool.poetry]
name = "pyomftools"
version = "0.1.0"
package-mode = false
description = "File format library for omf2097 data files"
authors = ["Tuomas Virtanen <katajakasa@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
pillow = "^12.1.1"
validx = "^0.8.1"
jinja2 = "^3.1.6"
natsort = "^8.4.0"
requests = "^2.33.0"

[tool.poetry.group.dev.dependencies]
mypy = "^1.2.0"
black = "^26.3.1"
pytest = "^9.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
